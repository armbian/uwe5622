PACKAGE_NAME="uwe5622"
PACKAGE_VERSION="1.0"

# The top-level Makefile selects what to build from the same CONFIG_* symbols
# the in-kernel Kconfig uses, and unisocwcn/Makefile builds the WCN core with
# obj-m as long as CONFIG_WCN_BSP_DRIVER_BUILDIN is unset (which it is here).
#
# CONFIG_AW_WIFI_DEVICE_UWE5622=y selects the Allwinner variant; it also sets
# CONFIG_WCN_SDIO and the module name (uwe5622_bsp_sdio). For Rockchip boards
# replace it with CONFIG_RK_WIFI_DEVICE_UWE5622=y.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KERNELRELEASE=${kernelver} CONFIG_AW_WIFI_DEVICE_UWE5622=y CONFIG_WLAN_UWE5622=m CONFIG_TTY_OVERY_SDIO=m"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="uwe5622_bsp_sdio"
BUILT_MODULE_LOCATION[0]="unisocwcn"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="sprdwl_ng"
BUILT_MODULE_LOCATION[1]="unisocwifi"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="sprdbt_tty"
BUILT_MODULE_LOCATION[2]="tty-sdio"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"
